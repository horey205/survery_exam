<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>측량자격시험 계산기 (교각)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            background-color: #eef2f7;
            margin: 20px;
            color: #333;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.8em;
        }

        h2 {
            color: #34495e;
            margin-top: 25px;
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        .input-group, .point-input {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #dbe4ed;
            border-radius: 8px;
            background-color: #f8fbfd;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
            font-size: 0.95em;
        }

        input[type="number"],
        input[type="text"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #cdd5df;
            border-radius: 5px;
            font-size: 1em;
            box-sizing: border-box;
        }

        input[type="number"]:focus,
        input[type="text"]:focus {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.2);
            outline: none;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1em;
            display: block;
            width: 100%;
            margin-top: 20px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        .results {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e6ed;
        }

        .results p {
            background-color: #e9f0f7;
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            font-size: 1em;
            word-wrap: break-word;
        }

        .results p strong {
            color: #0056b3;
        }

        #calculatedArea p {
            font-size: 1.1em;
            font-weight: bold;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            text-align: center;
            padding: 15px;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
            padding-top: 60px;
        }

        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 400px;
            border-radius: 10px;
            text-align: center;
        }

        #error-message {
            color: #d9534f;
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        #close-modal-btn {
            background-color: #5cb85c;
            color: white;
            border: none;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>측량자격시험 계산기 (교각)</h1>

        <div id="error-modal" class="modal">
            <div class="modal-content">
                <p id="error-message"></p>
                <button id="close-modal-btn">닫기</button>
            </div>
        </div>

        <div class="input-group">
            <h2>1. A점 (기준점)</h2>
            <label for="pointAX">X 좌표:</label>
            <input type="number" id="pointAX" placeholder="예: 200.000">
            <label for="pointAY">Y 좌표:</label>
            <input type="number" id="pointAY" placeholder="예: 150.000">
        </div>

        <div class="input-group">
            <h2>2. 초기 방위각 (A → P)</h2>
            <label for="bearingAP">방위각 (도-분-초, 예: 123-45-50):</label>
            <input type="text" id="bearingAP" placeholder="예: 123-45-50">
        </div>
        
        <div class="point-input">
            <h2>3. P점 계산 (A점 기준)</h2>
            <label for="distanceP">수평거리 (m):</label>
            <input type="number" id="distanceP" placeholder="예: 25.000">
        </div>

        <div class="point-input">
            <h2>4. B점 계산 (A점 기준)</h2>
            <label for="deflectionAngleB">교각 (도-분-초, 예: 70-30-20):</label>
            <input type="text" id="deflectionAngleB" placeholder="예: 70-30-20">
            <label for="distanceB">수평거리 (m):</label>
            <input type="number" id="distanceB" placeholder="예: 15.514">
        </div>

        <div class="point-input">
            <h2>5. Q점 계산 (B점 기준)</h2>
            <label for="deflectionAngleQ">교각 (도-분-초, 예: 85-46-12):</label>
            <input type="text" id="deflectionAngleQ" placeholder="예: 85-46-12">
            <label for="distanceQ">수평거리 (m):</label>
            <input type="number" id="distanceQ" placeholder="예: 19.375">
        </div>

        <button id="calculateBtn">좌표 및 면적 계산</button>

        <div class="results">
            <div id="calculatedBearings">
                <h2>계산된 방위각</h2>
                <p><strong>AB 방위각:</strong> <span id="displayBearingAB">계산 전</span> (도-분-초)</p>
                <p><strong>BQ 방위각:</strong> <span id="displayBearingBQ">계산 전</span> (도-분-초)</p>
            </div>
            <h2>계산된 좌표</h2>
            <div id="calculatedCoordinates">
                <p><strong>A점:</strong> X: <span id="displayAX"></span>, Y: <span id="displayAY"></span></p>
                <p><strong>P점:</strong> X: <span id="displayPX"></span>, Y: <span id="displayPY"></span></p>
                <p><strong>B점:</strong> X: <span id="displayBX"></span>, Y: <span id="displayBY"></span></p>
                <p><strong>Q점:</strong> X: <span id="displayQX"></span>, Y: <span id="displayQY"></span></p>
            </div>

            <h2>계산된 면적 (P-A-B-Q)</h2>
            <div id="calculatedArea">
                <p>면적: <span id="displayArea"></span> m²</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const calculateButton = document.getElementById('calculateBtn');
            const errorModal = document.getElementById('error-modal');
            const errorMessage = document.getElementById('error-message');
            const closeModalBtn = document.getElementById('close-modal-btn');
            
            const displayBearingAB = document.getElementById('displayBearingAB');
            const displayBearingBQ = document.getElementById('displayBearingBQ');

            // 초기 좌표값 표시 (A점은 입력값이므로 로드 시점에 표시)
            function displayInitialCoordinates() {
                const pointAX = document.getElementById('pointAX').value;
                const pointAY = document.getElementById('pointAY').value;

                document.getElementById('displayAX').textContent = pointAX ? parseFloat(pointAX).toFixed(3) : '';
                document.getElementById('displayAY').textContent = pointAY ? parseFloat(pointAY).toFixed(3) : '';
            }

            // A점 입력 필드 변경 시 즉시 좌표 업데이트
            document.getElementById('pointAX').addEventListener('input', displayInitialCoordinates);
            document.getElementById('pointAY').addEventListener('input', displayInitialCoordinates);
            displayInitialCoordinates(); // 페이지 로드 시 초기 표시

            function showModal(message) {
                errorMessage.textContent = message;
                errorModal.style.display = 'block';
            }

            closeModalBtn.onclick = function() {
                errorModal.style.display = 'none';
            }

            window.onclick = function(event) {
                if (event.target === errorModal) {
                    errorModal.style.display = 'none';
                }
            }

            /**
             * 도-분-초 문자열을 도(degrees)로 변환하는 함수
             * @param {string} dmsString 도-분-초 형식의 문자열 (예: '120-30-20')
             * @returns {number|null} 도(degrees) 또는 null (형식 오류 시)
             */
            function dmsToDegrees(dmsString) {
                const tempString = dmsString.trim();
                const parts = tempString.split('-').map(Number);
                
                if (parts.length === 3 && !parts.some(isNaN) && parts[1] < 60 && parts[2] < 60) {
                    const sign = parts[0] < 0 ? -1 : 1;
                    return sign * (Math.abs(parts[0]) + parseFloat(parts[1]) / 60 + parseFloat(parts[2]) / 3600);
                }
                return null;
            }

            /**
             * 도(degrees)를 도-분-초 문자열로 변환하는 함수
             * 초(Seconds)는 정수 두 자리로 표시됨 (예: '100-02-22')
             * @param {number} degrees 도(degrees)
             * @returns {string} 도-분-초 형식의 문자열
             */
            function degreesToDMS(degrees) {
                let normalizedDegrees = degrees % 360;
                if (normalizedDegrees < 0) {
                    normalizedDegrees += 360;
                }
                
                const d = Math.floor(normalizedDegrees);
                let minutesFloat = (normalizedDegrees - d) * 60;
                const m = Math.floor(minutesFloat);
                let s = (minutesFloat - m) * 60;
                
                // 요청에 따라 초(s)를 정수로 반올림
                let s_rounded_int = Math.round(s);

                // 초가 60초가 되면 분으로 올림 처리
                if (s_rounded_int >= 60) {
                    const m_new = m + 1;
                    s_rounded_int = 0; // 초는 0으로 리셋
                    
                    if (m_new >= 60) {
                        const d_new = d + 1;
                        // 초를 두 자리로 맞춤 ('00')
                        return `${d_new % 360}-${'00'.padStart(2, '0')}-${s_rounded_int.toString().padStart(2, '0')}`;
                    }
                    // 분과 초를 두 자리로 맞춤
                    return `${d}-${m_new.toString().padStart(2, '0')}-${s_rounded_int.toString().padStart(2, '0')}`;
                }
                
                // 분과 초를 두 자리로 맞춤 (예: 2 -> 02)
                const m_padded = m.toString().padStart(2, '0');
                const s_padded = s_rounded_int.toString().padStart(2, '0');

                const dms_string = `${d}-${m_padded}-${s_padded}`;
                return dms_string;
            }


            function degreesToRadians(degrees) {
                return degrees * (Math.PI / 180);
            }
            
            /**
             * 새로운 좌표를 계산하는 함수입니다.
             */
            function calculateNewCoordinate(originX, originY, bearingRadians, distance) {
                const deltaX = distance * Math.cos(bearingRadians);
                const deltaY = distance * Math.sin(bearingRadians);

                const newX = originX + deltaX;
                const newY = originY + deltaY;

                return { x: newX, y: newY };
            }

            /**
             * 다음 측점의 방위각을 계산하는 함수입니다.
             */
            function calculateNextBearing(prevBearing, deflectionAngle) {
                let newBearing = prevBearing + deflectionAngle;
                
                while (newBearing >= 360) {
                    newBearing -= 360;
                }
                while (newBearing < 0) {
                    newBearing += 360;
                }
                return newBearing;
            }

            // Function to calculate the area of a polygon using the Shoelace formula
            function calculatePolygonArea(points) {
                let area = 0;
                const n = points.length;

                for (let i = 0; i < n; i++) {
                    const j = (i + 1) % n;
                    area += (points[i].x * points[j].y);
                    area -= (points[i].y * points[j].x);
                }

                return Math.abs(area / 2);
            }

            calculateButton.addEventListener('click', () => {
                // Clear previous coordinate/area results
                document.getElementById('displayPX').textContent = '';
                document.getElementById('displayPY').textContent = '';
                document.getElementById('displayBX').textContent = '';
                document.getElementById('displayBY').textContent = '';
                document.getElementById('displayQX').textContent = '';
                document.getElementById('displayQY').textContent = '';
                document.getElementById('displayArea').textContent = '';
                
                // Clear bearings display (resetting to '계산 중...' 또는 초기 값)
                displayBearingAB.textContent = '계산 중...';
                displayBearingBQ.textContent = '계산 중...';


                // 1. Get A point coordinates and initial bearing A -> P
                const pointAX = parseFloat(document.getElementById('pointAX').value);
                const pointAY = parseFloat(document.getElementById('pointAY').value);
                const bearingAP_dms_str = document.getElementById('bearingAP').value;

                if (isNaN(pointAX) || isNaN(pointAY)) {
                    showModal("A점 X, Y 좌표를 올바른 숫자로 입력해주세요.");
                    return;
                }
                const bearingAP_deg = dmsToDegrees(bearingAP_dms_str);
                if (bearingAP_deg === null) {
                    showModal("초기 방위각 형식이 올바르지 않습니다. '도-분-초' 형식으로 입력해주세요 (예: 123-45-50).");
                    return;
                }
                
                // 2. Calculate P point from A
                const distanceP = parseFloat(document.getElementById('distanceP').value);
                if (isNaN(distanceP)) {
                    showModal("P점의 수평거리를 올바른 숫자로 입력해주세요.");
                    return;
                }
                const bearingAP_rad = degreesToRadians(bearingAP_deg);
                const pointP = calculateNewCoordinate(pointAX, pointAY, bearingAP_rad, distanceP);
                
                // 3. Calculate B point from A using deflection angle from A->P
                const deflectionAngleB_dms_str = document.getElementById('deflectionAngleB').value;
                const distanceB = parseFloat(document.getElementById('distanceB').value);
                const deflectionAngleB_deg = dmsToDegrees(deflectionAngleB_dms_str);
                if (deflectionAngleB_deg === null) {
                    showModal("B점의 교각 형식이 올바르지 않습니다. '도-분-초' 형식으로 입력해주세요.");
                    return;
                }
                if (isNaN(distanceB)) {
                    showModal("B점의 수평거리를 올바른 숫자로 입력해주세요.");
                    return;
                }
                
                // AB 방위각 계산 (A->P 방위각에서 교각 B를 더함)
                const bearingAB_deg = calculateNextBearing(bearingAP_deg, deflectionAngleB_deg);
                const bearingAB_rad = degreesToRadians(bearingAB_deg);
                const pointB = calculateNewCoordinate(pointAX, pointAY, bearingAB_rad, distanceB);

                // 4. Calculate Q point from B using deflection angle from B->A
                const deflectionAngleQ_dms_str = document.getElementById('deflectionAngleQ').value;
                const distanceQ = parseFloat(document.getElementById('distanceQ').value);
                const deflectionAngleQ_deg = dmsToDegrees(deflectionAngleQ_dms_str);
                if (deflectionAngleQ_deg === null) {
                    showModal("Q점의 교각 형식이 올바르지 않습니다. '도-분-초' 형식으로 입력해주세요.");
                    return;
                }
                if (isNaN(distanceQ)) {
                    showModal("Q점의 수평거리를 올바른 숫자로 입력해주세요.");
                    return;
                }
                
                // BA 방위각 = AB 방위각 + 180도 (180도 초과 시 360도 빼줌)
                const bearingBA_deg = calculateNextBearing(bearingAB_deg, 180);
                
                // BQ 방위각 계산 (B->A 방위각에서 교각 Q를 더함)
                const bearingBQ_deg = calculateNextBearing(bearingBA_deg, deflectionAngleQ_deg);
                const bearingBQ_rad = degreesToRadians(bearingBQ_deg);
                const pointQ = calculateNewCoordinate(pointB.x, pointB.y, bearingBQ_rad, distanceQ);

                // **방위각 결과 업데이트**
                displayBearingAB.textContent = degreesToDMS(bearingAB_deg);
                displayBearingBQ.textContent = degreesToDMS(bearingBQ_deg);


                // 5. Display coordinates results
                // A점은 이미 displayInitialCoordinates에서 처리했으나, 혹시 몰라 다시 한번.
                document.getElementById('displayAX').textContent = pointAX.toFixed(3);
                document.getElementById('displayAY').textContent = pointAY.toFixed(3);
                
                document.getElementById('displayPX').textContent = pointP.x.toFixed(3);
                document.getElementById('displayPY').textContent = pointP.y.toFixed(3);
                document.getElementById('displayBX').textContent = pointB.x.toFixed(3);
                document.getElementById('displayBY').textContent = pointB.y.toFixed(3);
                document.getElementById('displayQX').textContent = pointQ.x.toFixed(3);
                document.getElementById('displayQY').textContent = pointQ.y.toFixed(3);

                // 6. Calculate and display area (P, A, B, Q order)
                const polygonPoints = [
                    { x: pointP.x, y: pointP.y },
                    { x: pointAX, y: pointAY },
                    { x: pointB.x, y: pointB.y },
                    { x: pointQ.x, y: pointQ.y }
                ];
                const area = calculatePolygonArea(polygonPoints);
                document.getElementById('displayArea').textContent = area.toFixed(3);
            });
        });
    </script>
</body>
</html>
