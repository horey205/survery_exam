<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지적산업기사 측량 방위각 계산</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; background-color: #eef2f7; margin: 20px; color: #333; }
        .container { background-color: #ffffff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); width: 100%; max-width: 600px; box-sizing: border-box; }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 25px; font-size: 1.8em; }
        h2 { color: #34495e; margin-top: 25px; margin-bottom: 15px; font-size: 1.3em; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .input-group, .result-section { margin-bottom: 20px; padding: 15px; border: 1px solid #dbe4ed; border-radius: 8px; background-color: #f8fbfd; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; font-size: 0.95em; }
        input[type="text"] { width: calc(100% - 20px); padding: 10px; margin-bottom: 15px; border: 1px solid #cdd5df; border-radius: 5px; font-size: 1em; box-sizing: border-box; }
        button { background-color: #007bff; color: white; padding: 12px 25px; border: none; border-radius: 6px; cursor: pointer; font-size: 1.1em; display: block; width: 100%; margin-top: 20px; transition: background-color 0.3s ease; }
        button:hover { background-color: #0056b3; }
        .results { margin-top: 30px; padding-top: 20px; border-top: 1px solid #e0e6ed; }
        .results p { background-color: #e9f0f7; padding: 10px 15px; margin-bottom: 10px; border-radius: 5px; font-size: 1em; word-wrap: break-word; }
        .results p strong { color: #0056b3; }
        .formula { background-color: #f0f8ff; padding: 15px; border-left: 4px solid #007bff; margin-top: 15px; }
        .formula p { margin: 0; font-family: 'Courier New', Courier, monospace; }
        .modal { display: none; position: fixed; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4); padding-top: 60px; }
        .modal-content { background-color: #fefefe; margin: 5% auto; padding: 20px; border: 1px solid #888; width: 80%; max-width: 400px; border-radius: 10px; text-align: center; }
        #error-message { color: #d9534f; font-size: 1.1em; margin-bottom: 20px; }
        #close-modal-btn { background-color: #5cb85c; color: white; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>지적산업기사 측량 방위각 계산</h1>

        <div id="error-modal" class="modal">
            <div class="modal-content">
                <p id="error-message"></p>
                <button id="close-modal-btn">닫기</button>
            </div>
        </div>

        <div class="input-group">
            <h2>1. 초기 방위각 (A → P)</h2>
            <label for="bearingAP">방위각 (도-분-초, 예: 235-35-20):</label>
            <input type="text" id="bearingAP" placeholder="예: 235-35-20">
        </div>

        <div class="input-group">
            <h2>2. A점에서의 교각 (A → B)</h2>
            <label for="deflectionAngleAB">교각 (도-분-초, 예: 80-04-45):</label>
            <input type="text" id="deflectionAngleAB" placeholder="예: 80-04-45">
        </div>

        <div class="input-group">
            <h2>3. B점에서의 교각 (B → C)</h2>
            <label for="deflectionAngleBC">교각 (도-분-초, 예: 83-23-31):</label>
            <input type="text" id="deflectionAngleBC" placeholder="예: 83-23-31">
        </div>

        <div class="input-group">
            <h2>4. C점에서의 교각 (C → D)</h2>
            <label for="deflectionAngleCD">교각 (도-분-초, 예: 60-40-05):</label>
            <input type="text" id="deflectionAngleCD" placeholder="예: 60-40-05">
        </div>

        <div class="input-group">
            <h2>5. D점에서의 교각 (D → Q)</h2>
            <label for="deflectionAngleDQ">교각 (도-분-초, 예: 20-55-45):</label>
            <input type="text" id="deflectionAngleDQ" placeholder="예: 20-55-45">
        </div>

        <button id="calculateBtn">방위각 계산</button>

        <div class="results">
            <h2>계산된 방위각</h2>
            <div id="calculatedBearings">
                <p><strong>A → B 방위각:</strong> <span id="displayBearingAB"></span></p>
                <p><strong>B → C 방위각:</strong> <span id="displayBearingBC"></span></p>
                <p><strong>C → D 방위각:</strong> <span id="displayBearingCD"></span></p>
                <p><strong>D → Q 방위각:</strong> <span id="displayBearingDQ"></span></p>
            </div>
            <h2>계산식</h2>
            <div id="calculationFormulas" class="formula"></div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const calculateButton = document.getElementById('calculateBtn');
            const errorModal = document.getElementById('error-modal');
            const errorMessage = document.getElementById('error-message');
            const closeModalBtn = document.getElementById('close-modal-btn');

            function showModal(message) {
                errorMessage.textContent = message;
                errorModal.style.display = 'block';
            }

            closeModalBtn.onclick = function() {
                errorModal.style.display = 'none';
            }

            window.onclick = function(event) {
                if (event.target == errorModal) {
                    errorModal.style.display = 'none';
                }
            }

            /**
             * 도-분-초 문자열을 도(degrees)로 변환하는 함수
             * @param {string} dmsString 도-분-초 형식의 문자열 (예: '120-30-20')
             * @returns {number|null} 도(degrees) 또는 null (형식 오류 시)
             */
            function dmsToDegrees(dmsString) {
                const tempString = dmsString.trim();
                const parts = tempString.split('-').map(Number);
                
                if (parts.length === 3 && !parts.some(isNaN) && parts[1] < 60 && parts[2] < 60) {
                    const sign = parts[0] < 0 ? -1 : 1;
                    return sign * (Math.abs(parts[0]) + parseFloat(parts[1]) / 60 + parseFloat(parts[2]) / 3600);
                }
                return null;
            }

            /**
             * 도(degrees)를 도-분-초 문자열로 변환하는 함수
             * @param {number} degrees 십진수 도.
             * @returns {string} 도-분-초 형식의 문자열.
             */
            function degreesToDMS(degrees) {
                const sign = degrees < 0 ? "-" : "";
                degrees = Math.abs(degrees);
                const d = Math.floor(degrees);
                const minutesFloat = (degrees - d) * 60;
                const m = Math.floor(minutesFloat);
                const secondsFloat = (minutesFloat - m) * 60;
                const s = secondsFloat.toFixed(2);
                return `${sign}${d}-${m}-${s}`;
            }

            /**
             * 다음 측점의 방위각을 계산하는 함수입니다.
             * 이전 방위각의 역방위각(180도 추가)에 교각을 더하는 방식으로 계산합니다.
             * @param {number} prevBearing 이전 방위각(도).
             * @param {number} deflectionAngle 교각(도).
             * @returns {number} 새로운 방위각(도).
             */
            function calculateNextBearing(prevBearing, deflectionAngle) {
                let backBearing = prevBearing + 180;
                if (backBearing >= 360) {
                    backBearing -= 360;
                }
                let newBearing = backBearing + deflectionAngle;
                
                while (newBearing >= 360) {
                    newBearing -= 360;
                }
                while (newBearing < 0) {
                    newBearing += 360;
                }
                return newBearing;
            }

            calculateButton.addEventListener('click', () => {
                const bearingAP_dms_str = document.getElementById('bearingAP').value;
                const deflectionAngleAB_dms_str = document.getElementById('deflectionAngleAB').value;
                const deflectionAngleBC_dms_str = document.getElementById('deflectionAngleBC').value;
                const deflectionAngleCD_dms_str = document.getElementById('deflectionAngleCD').value;
                const deflectionAngleDQ_dms_str = document.getElementById('deflectionAngleDQ').value;
                
                // 입력 값 초기화
                const resultsDiv = document.getElementById('calculatedBearings');
                resultsDiv.querySelectorAll('span').forEach(span => span.textContent = '');
                const formulasDiv = document.getElementById('calculationFormulas');
                formulasDiv.innerHTML = '';

                const bearingAP_deg = dmsToDegrees(bearingAP_dms_str);
                if (bearingAP_deg === null) {
                    showModal("초기 방위각(A→P) 형식이 올바르지 않습니다. '도-분-초' 형식으로 입력해주세요.");
                    return;
                }

                const deflectionAngleAB_deg = dmsToDegrees(deflectionAngleAB_dms_str);
                if (deflectionAngleAB_deg === null) {
                    showModal("A점에서의 교각(A→B) 형식이 올바르지 않습니다.");
                    return;
                }
                
                // A -> B 방위각 계산
                let bearingAB_deg = bearingAP_deg + deflectionAngleAB_deg;
                while (bearingAB_deg >= 360) {
                    bearingAB_deg -= 360;
                }
                while (bearingAB_deg < 0) {
                    bearingAB_deg += 360;
                }
                document.getElementById('displayBearingAB').textContent = degreesToDMS(bearingAB_deg);
                formulasDiv.innerHTML += `<p><strong>A → B 방위각:</strong> (A → P 방위각) + (A점 교각) = ${degreesToDMS(bearingAP_deg)} + ${degreesToDMS(deflectionAngleAB_deg)} = ${degreesToDMS(bearingAB_deg)}</p>`;

                const deflectionAngleBC_deg = dmsToDegrees(deflectionAngleBC_dms_str);
                if (deflectionAngleBC_deg === null) {
                    showModal("B점에서의 교각(B→C) 형식이 올바르지 않습니다.");
                    return;
                }
                
                // B -> C 방위각 계산
                const bearingBC_deg = calculateNextBearing(bearingAB_deg, deflectionAngleBC_deg);
                document.getElementById('displayBearingBC').textContent = degreesToDMS(bearingBC_deg);
                formulasDiv.innerHTML += `<p><strong>B → C 방위각:</strong> (A → B 역방위각) + (B점 교각) = (${degreesToDMS(bearingAB_deg)} + 180) + ${degreesToDMS(deflectionAngleBC_deg)} = ${degreesToDMS(bearingBC_deg)}</p>`;

                const deflectionAngleCD_deg = dmsToDegrees(deflectionAngleCD_dms_str);
                if (deflectionAngleCD_deg === null) {
                    showModal("C점에서의 교각(C→D) 형식이 올바르지 않습니다.");
                    return;
                }
                
                // C -> D 방위각 계산
                const bearingCD_deg = calculateNextBearing(bearingBC_deg, deflectionAngleCD_deg);
                document.getElementById('displayBearingCD').textContent = degreesToDMS(bearingCD_deg);
                formulasDiv.innerHTML += `<p><strong>C → D 방위각:</strong> (B → C 역방위각) + (C점 교각) = (${degreesToDMS(bearingBC_deg)} + 180) + ${degreesToDMS(deflectionAngleCD_deg)} = ${degreesToDMS(bearingCD_deg)}</p>`;
                
                const deflectionAngleDQ_deg = dmsToDegrees(deflectionAngleDQ_dms_str);
                if (deflectionAngleDQ_deg === null) {
                    showModal("D점에서의 교각(D→Q) 형식이 올바르지 않습니다.");
                    return;
                }
                
                // D -> Q 방위각 계산
                const bearingDQ_deg = calculateNextBearing(bearingCD_deg, deflectionAngleDQ_deg);
                document.getElementById('displayBearingDQ').textContent = degreesToDMS(bearingDQ_deg);
                formulasDiv.innerHTML += `<p><strong>D → Q 방위각:</strong> (C → D 역방위각) + (D점 교각) = (${degreesToDMS(bearingCD_deg)} + 180) + ${degreesToDMS(deflectionAngleDQ_deg)} = ${degreesToDMS(bearingDQ_deg)}</p>`;
            });
        });
    </script>
</body>
</html>
